<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="QuickTools is an open-source browser workbench for formatting data, encoding text, and converting images."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>QuickTools</title>
    <script type="module" crossorigin src="/assets/index-BRocJpOJ.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-D7Q3V9SW.css">
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      (() => {
        let theme = 'dark';
        try {
          const savedTheme = localStorage.getItem('quicktools.theme');
          theme = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : 'dark';
        } catch {
          theme = 'dark';
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </body>
</html>
